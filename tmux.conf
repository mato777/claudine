# tmux settings claudine needs. Load it from ~/.tmux.conf with:
#   source-file ~/.config/nvim/tmux.conf
# It only sets these three options; your other tmux settings (e.g. mouse) stay yours.

set -g set-clipboard on   # copies in Neovim reach your Mac's clipboard (OSC 52)
set -g bell-action any    # Claude's "session needs you" bell reaches Warp
set -g escape-time 10     # Option shortcuts arrive as Esc+key: don't wait 500 ms

# Optional: `set -g mouse on` lets Neovim get the mouse (drag split bars,
# double-click links). Then hold Shift while dragging in Warp to select text.
